server:
  port: 8081

spring:
  application:
    name: local-review
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:local_review}?useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

# 图片上传目录，默认相对启动路径 ./uploads/，可自定义为任意本地目录
app:
  upload-dir: ${UPLOAD_DIR:./uploads/}

mybatis-plus:
  type-aliases-package: com.localreview.entity # 别名扫描包

logging:
  level:
    com.localreview: debug
